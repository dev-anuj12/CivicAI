<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="civicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="50%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0D9488" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Hexagon / Shield Base -->
  <rect x="6" y="6" width="88" height="88" rx="26" fill="url(#civicGrad)" filter="url(#glow)" />
  
  <!-- Subtle Grid Accent -->
  <path d="M6 36 H94 M6 64 H94 M36 6 V94 M64 6 V94" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Municipal Skyline & Architecture -->
  <path d="M24 72 V50 H36 V34 H50 V44 H64 V56 H76 V72 Z" fill="#ffffff" fill-opacity="0.18" />
  
  <!-- Smart AI Geometric Node Path -->
  <path d="M28 68 L44 52 L56 60 L72 38" stroke="url(#accentGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Neural Connectivity Nodes -->
  <circle cx="28" cy="68" r="4.5" fill="#34D399" />
  <circle cx="44" cy="52" r="4.5" fill="#38BDF8" />
  <circle cx="56" cy="60" r="4.5" fill="#34D399" />
  <circle cx="72" cy="38" r="5.5" fill="#FFFFFF" stroke="#0D9488" stroke-width="2.5" />

  <!-- AI Intelligence Star Spark -->
  <path d="M72 24 L74.2 30 L80 32 L74.2 34 L72 40 L69.8 34 L64 32 L69.8 30 Z" fill="#FDE047" />
</svg>
